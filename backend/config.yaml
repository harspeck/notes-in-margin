# Prototype config — model id/effort and other tunables live here, not in code,
# so they can change without a rebuild (PRD: "AI behavior" / "Model and editable prompt").

# "snapshot": local read-only Cortico copy, single implicit user (default_user_id).
# "cortico_api": users sign in with Cortico; reads go to the v2 API. Env DATA_SOURCE overrides.
data_source: "snapshot"

cortico:
  base_url: "https://api2.cortico.ai"
  timeout_seconds: 20
  max_retries: 2
  snippet_cache_ttl_seconds: 3600
  tool_id: "notes-in-the-margin"
  write_back:
    highlights: true

session:
  cookie_name: "nim_session"
  max_age_days: 7
  cookie_samesite: "lax"

default_user_id: 101
default_project_id: 5

cortico_db_path: "../acp_pipeline_snapshot.db"
prototype_db_path: "db/prototype.db"
audio_dir: "db/local/audio"

ai_review:
  provider: "anthropic"
  model: "claude-opus-5-5"
  reasoning_effort: "low"
  max_output_tokens: 32000

transcription:
  engine: "faster-whisper (local)"
  model_size: "small.en"
  compute_type: "int8"

voice_memo:
  max_duration_seconds: 1200

# Code families are broad parent themes (future parents of child codes), so keep few per RQ.
code_families:
  max_per_rq: 5
  near_cap_at: 4
  max_new_per_run: 2
